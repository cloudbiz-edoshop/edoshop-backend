name: Bug report
description: Report a defect in Edoshop backend / API
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    value: |
      For admin or storefront UI bugs, open the issue in **edoshop-admin** or **edoshop** instead.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Screenshots / Steve chat / logs
      description: Paste links or log excerpts (no secrets).
